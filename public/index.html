<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=yes">
<title>Cadence — Playbook Execution</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-mark">◈</span> Cadence</div>
    <div class="run-picker">
      <select id="run-select" aria-label="Select playbook run"></select>
      <button id="btn-new-run" class="btn ghost" title="Start a new run">＋</button>
    </div>
  </header>

  <aside id="sidenav">
    <div class="brand"><span class="brand-mark">◈</span> Cadence</div>
    <nav id="side-tabs"></nav>
    <div class="side-foot" id="side-overall"></div>
  </aside>

  <main id="views">
    <section id="view-today" class="view"></section>
    <section id="view-playbook" class="view" hidden></section>
    <section id="view-kpis" class="view" hidden></section>
    <section id="view-activity" class="view" hidden></section>
    <section id="view-illiad" class="view" hidden></section>
    <section id="view-people" class="view" hidden></section>
  </main>

  <nav id="tabbar">
    <button data-tab="today" class="tab active"><span class="tab-ico">◉</span><span>Today</span></button>
    <button data-tab="playbook" class="tab"><span class="tab-ico">▤</span><span>Playbook</span></button>
    <button data-tab="kpis" class="tab"><span class="tab-ico">◔</span><span>KPIs</span></button>
    <button data-tab="activity" class="tab"><span class="tab-ico">≋</span><span>Activity</span></button>
    <button data-tab="illiad" class="tab"><span class="tab-ico">✦</span><span>Illiad</span></button>
    <button data-tab="people" class="tab"><span class="tab-ico">◍</span><span>People</span></button>
  </nav>
</div>

<div id="sheet-backdrop" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div id="sheet-body"></div></div>

<script src="/app.js"></script>
</body>
</html>
